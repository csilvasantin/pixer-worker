name = "pixer-eleven"
main = "src/worker.js"
compatibility_date = "2026-05-02"

# Secrets se ponen con: npx wrangler secret put NOMBRE
# - ELEVENLABS_KEY  (obligatoria)
# - XAI_KEY         (opcional, para futuras llamadas a Grok)
# - ADMIRANEXT_INGEST_TOKEN (compartida con admiranext Pages para ingest idempotente)

[observability]
enabled = true

# Cron de respaldo: regenera stock/index.json (índice estático servido por
# r2.dev, que esquiva el bloqueo ISP de workers.dev). Las mutaciones también
# lo regeneran al vuelo; esto cubre escrituras perdidas.
[triggers]
crons = ["*/10 * * * *", "*/2 * * * *"]

# KV para signage de Admira XP (también usado por stock con prefijos stock:meta:* y stock_index)
[[kv_namespaces]]
binding = "SIGNAGE_KV"
id = "013098f4df534234994ae04b8c1929a5"

# R2 para Stock público (blobs de audio/música/imágenes/video)
# Crear con: npx wrangler r2 bucket create pixer-stock
[[r2_buckets]]
binding = "STOCK_BUCKET"
bucket_name = "pixer-stock"

# Service binding al cerebro del DigitalAvatar.ai / Metahuman. Un Worker NO puede
# hacer fetch() a otro Worker del mismo *.workers.dev (error 1042); el binding
# enruta la subpetición por la malla interna de Cloudflare. Lo usa el proxy /da/*
# para esquivar el bloqueo ISP español de workers.dev sin tocar al cliente.
[[services]]
binding = "OMNI"
service = "omnipublicity-api"

# Tope diario partido: 60.000 generales + 10.000 reservadas a presencia de
# pantallas = 70.000/día (~2,1 M/mes en el peor caso; ~5,5 $/mes por encima del millón incluido).
# La reserva evita que Agora/layout deje ciego el CMS cuando agota su pool.
# 14-oct-2026 (Neo, OK de Carlos: «no se puede parar»): el general llegó a 22.000/22.000
# y /signage/now dejó de guardar el estado de todos los players. Subido a 30.000 mientras
# se lleva el estado de las pantallas a un Durable Object (KV no es para un latido).
[vars]
KV_DAILY_WRITE_CAP = "60000"
KV_CRITICAL_DAILY_WRITE_CAP = "10000"
# POST /xpacio/estimar (▤ Creación de Xpacios · «Con foto o vídeo», DCL-ddf3203078fe9471f3796130):
# cupo de estimaciones con Gemini 3.1 Pro (~0,13 $ cada una). Por IP y día (memoria del isolate) y
# global por día (KV). XPACIO_ESTIMAR_OFF = "1" corta la ruta; XPACIO_ESTIMAR_MODELO elige otro
# modelo de la lista de src/xpacio-estimar.mjs.
XPACIO_ESTIMAR_TOPE_IP = "12"
XPACIO_ESTIMAR_TOPE_DIA = "100"
